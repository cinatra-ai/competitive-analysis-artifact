name: truthful-attribution-gate
# Thin caller for the org-reusable truthful-attribution-gate (cinatra-ai/ci),
# per org attribution policy. Advisory WARN mode: findings are annotated, the
# check is always green and never fails a PR. No gate-suite file is committed
# (WARN scope exercises presence + the human arm only).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is required: the engine resolves a reusable-workflow check-run to
  # its Actions run to verify the referenced workflows at the pinned commit. With an
  # explicit permissions block any omitted scope defaults to none, and a called
  # reusable workflow cannot exceed the caller grant, so dropping this would cause
  # a startup failure that WARN mode cannot rescue.
  actions: read

jobs:
  truthful-attribution-gate:
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@8eede1022e835997d94974e4bd6205daf72131a2 # v0.1.0+sha.8eede10
    with:
      mode: warn
      ref: 8eede1022e835997d94974e4bd6205daf72131a2
